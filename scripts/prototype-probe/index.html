<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "react": "artifact://localhost/lib/react.js",
          "react-dom/client": "artifact://localhost/lib/react-dom-client.js",
          "react/jsx-runtime": "artifact://localhost/lib/react-jsx-runtime.js"
        }
      }
    </script>
    <script src="artifact://localhost/lib/babel.min.js"></script>
  </head>
  <body>
    <div id="root">not rendered</div>
    <!-- What a model writes: JSX, hooks, an import map. -->
    <script type="text/babel" data-type="module" data-presets="react">
      import { useState, useEffect } from "react";
      import { createRoot } from "react-dom/client";

      function App() {
        const [n, setN] = useState(0);
        useEffect(() => setN(1), []);
        return <h1 id="hello">React works, effect ran {n} time</h1>;
      }
      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { run } from "./checks.js";
      setTimeout(async () => {
        const rendered = document.getElementById("hello")?.textContent ?? null;
        parent.postMessage({ kind: "render", rendered }, "*");
        await run("with CSP");
      }, 1500);
    </script>
  </body>
</html>
