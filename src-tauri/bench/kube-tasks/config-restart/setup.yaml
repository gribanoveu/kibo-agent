apiVersion: v1
kind: ConfigMap
metadata: {name: flags}
data: {MODE: old}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: app
          image: busybox
          envFrom: [{configMapRef: {name: flags}}]
          command: [sh, -c, 'echo "INFO  ApiApplication : started with mode=$MODE"; sleep 86400']
