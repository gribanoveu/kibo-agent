apiVersion: apps/v1
kind: Deployment
metadata: {name: orders}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders, tier: backend}}
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: orders}
spec:
  selector: {app: orders-api, tier: backend}
  ports: [{port: 80, targetPort: 80}]
