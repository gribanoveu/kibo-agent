[package]
name = "kibo-agent"
version = "0.1.1"
# GPL because `domain::command_risk` builds on sh-guard's rules (GPL-3.0-only).
license = "GPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kibo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for the transparent (rounded-corner) window.
# Note: it makes the bundle ineligible for the Mac App Store.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4.33"
regex = "1.13.1"
globset = "0.4.20"
similar = "3.2.0"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_path_to_error = "0.1.20"
aes-gcm = "0.10"
zeroize = "1"
rand = "0.8"
dirs = "7.0.0"
keyring = "3"
ureq = { version = "3", features = ["json"] }
secrecy = "0.10"
uuid = { version = "1", features = ["v4"] }
http = "1"
tauri-plugin-dialog = "2.7.3"
blake3 = "1.8.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Grammars depend on `tree-sitter-language`, not on the runtime, and declare no
# `links` — so their versions no longer have to agree with it or each other.
# The tests in `infra::language_indexers` load every grammar into this runtime
# and check every node name against it; a bump that breaks either fails there.
tree-sitter = "0.27"
# Named directly only for the `LanguageFn` type the grammar table holds; it is
# already in the graph through every grammar.
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
pulldown-cmark = { version = "0.13", default-features = false }
# The tokenizer of the bundled embedding model (`infra::local_embeddings`).
# Without `esaxx_fast`, which upstream had to leave out on purpose: through
# model2vec-rs it turned on `esaxx-rs/cpp`, whose build.rs compiles C++ with a
# hard-coded `.static_crt(true)` (/MT) while everything else on MSVC links /MD,
# and the Windows build fails with `LNK2038: mismatch detected for
# 'RuntimeLibrary'`. It only speeds up *training* a Unigram tokenizer; this is
# inference only. model2vec-rs itself is gone (F-5.8c): it widened the int8
# table to f32, and the pooling it did is thirty lines here.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
notify = "8"
yaml_serde = "0.10"
tree-sitter-bash = "0.25"
portable-pty = "0.9.0"
vt100 = "0.16.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tauri-plugin-notification = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Platform keychain backends in keyring 3.x are opt-in features. Without one
# the crate compiles to an in-memory mock whose writes return Ok(()) and
# evaporate at process exit — a store that only pretends to work. The base
# declaration above stays so an unsupported platform still builds, and
# `infra::master_key` detects the mock at runtime and goes to the file fallback
# honestly instead of losing the key silently.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# `sync-secret-service`: a blocking Secret Service client over dbus, since
# there is no free async context here. `crypto-rust` encrypts the dbus
# transport itself without depending on the system OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Killing a timed-out command means killing its whole process group:
# `Child::kill()` signals the direct child only, and `sh -c '... &'` leaves the
# grandchild running. `kill(-pgid, SIGKILL)` is the syscall for that, and libc
# is the only way to reach it — see `infra::process_runner`.
[target."cfg(unix)".dependencies]
libc = "0.2.189"

# One running copy: a second launch focuses the first and exits. Two copies
# would share `~/.kibo` — chats, the index and the call log — and
# write over each other.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
# Size, position and maximized state of the window, back as they were left.
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
