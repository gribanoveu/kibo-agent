name: Build and Release

# On main too, for the cache: a tag's run can read only its own caches and
# main's, so without a release build on main every tag compiled from nothing
# (21 min on Windows). Main's runs also publish their installers as the one
# `nightly` pre-release, replaced on every push; a tag publishes a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

# A newer commit on main makes an unfinished build of the last one pointless;
# a tag's build is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Saved from main only: a cache saved under a tag is read by nothing else.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup NASM (needed by git2 vendored OpenSSL build)
        uses: ilammy/setup-nasm@v1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Main's build is the next patch with the run number after it: newer than
      # the last release, and numeric after the dash because MSI takes no other.
      - name: Build Tauri app
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v=$(bun -p "require('./src-tauri/tauri.conf.json').version")
            v="${v%.*}.$(( ${v##*.} + 1 ))-$GITHUB_RUN_NUMBER"
            bun run tauri build --config "{\"version\":\"$v\"}"
          else
            bun run tauri build
          fi

      - name: Upload MSI/NSIS installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      # Vite bundle (monaco, shiki, mermaid) exceeds default ~2 GiB heap on CI runners.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Saved from main only: a cache saved under a tag is read by nothing else.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Main's build is the next patch with the run number after it: newer than
      # the last release, and numeric after the dash because MSI takes no other.
      - name: Build Tauri app
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v=$(bun -p "require('./src-tauri/tauri.conf.json').version")
            v="${v%.*}.$(( ${v##*.} + 1 ))-$GITHUB_RUN_NUMBER"
            bun run tauri build --config "{\"version\":\"$v\"}"
          else
            bun run tauri build
          fi
        env:
          CI: true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Описание релиза - тело сообщения аннотированного тега, и берётся оно
      # через API, а не из клона: actions/checkout заводит у себя легковесный
      # тег, а на нём `git tag --format=%(contents:body)` молча отдаёт тело
      # сообщения коммита вместо тега (так в релиз 0.6.1 уехал один trailer
      # Co-Authored-By). Первые две строки - заголовок тега и пустая строка за
      # ним - отбрасываются: заголовок уже стоит в названии релиза.
      # За ним - раздел CHANGELOG.md этой версии (`## <тег> — <дата>`) с того же
      # коммита, если в сообщении тега его ещё нет.
      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' \
            | tail -n +3 > "$RUNNER_TEMP/notes.md"
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" \
            -H "Accept: application/vnd.github.raw" \
            | awk -v tag="## $GITHUB_REF_NAME " 'index($0, tag) == 1 {f = 1; next} /^## / {f = 0} f && NF' \
            > "$RUNNER_TEMP/changes.md"
          if [ -s "$RUNNER_TEMP/changes.md" ] && ! grep -q '^## Changelog' "$RUNNER_TEMP/notes.md"; then
            printf '\n## Changelog\n\n' >> "$RUNNER_TEMP/notes.md"
            cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          # v0.8.0-rc.1, v0.5.0-alfa: a pre-release, not the Latest one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg

      # One pre-release, replaced by every push to main: deleted with its tag
      # and created again on this commit.
      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          files=(dist/**/*.msi dist/**/*.exe dist/**/*.dmg)
          v=$(basename "${files[-1]}" | sed -E 's/^.*_([^_]+)_[^_]+\.dmg$/\1/')
          gh release delete nightly --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create nightly "${files[@]}" --prerelease --target "$GITHUB_SHA" \
            -R "$GITHUB_REPOSITORY" \
            --title "Nightly $v · $(date -u +%F) (${GITHUB_SHA::7})" \
            --notes "Build of main at $GITHUB_SHA, not a release."
