name: Build and Release

# On main too, for the cache: a tag's run can read only its own caches and
# main's, so without a release build on main every tag compiled from nothing
# (21 min on Windows). Main's runs also publish their installers as the one
# `nightly` pre-release, replaced on every push; a tag publishes a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

# A newer commit on main makes an unfinished build of the last one pointless;
# a tag's build is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # No directory named `target` on the way: see test.yml.
      CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/cargo-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Saved from main only: a cache saved under a tag is read by nothing else.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../cargo-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup NASM (needed by git2 vendored OpenSSL build)
        uses: ilammy/setup-nasm@v1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ~250 MB from Hugging Face, kept between runs: the key changes only
      # when the script's pinned files do.
      - name: Meeting models cache
        uses: actions/cache@v4
        with:
          path: src-tauri/models/meeting
          key: meeting-models-${{ hashFiles('scripts/fetch-meeting-models.ts') }}

      - name: Fetch meeting models
        run: bun scripts/fetch-meeting-models.ts

      # Main's build is the next patch with the run number after it: newer than
      # the last release, and numeric after the dash because MSI takes no other.
      - name: Build Tauri app
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v=$(bun -p "require('./src-tauri/tauri.conf.json').version")
            v="${v%.*}.$(( ${v##*.} + 1 ))-$GITHUB_RUN_NUMBER"
            bun run tauri build --config "{\"version\":\"$v\"}"
          else
            bun run tauri build
          fi

      - name: Upload MSI/NSIS installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            cargo-build/release/bundle/msi/*.msi
            cargo-build/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      # Vite bundle (monaco, shiki, mermaid) exceeds default ~2 GiB heap on CI runners.
      NODE_OPTIONS: --max-old-space-size=8192
      # No directory named `target` on the way: see test.yml.
      CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/cargo-build
      # A step cannot read `secrets` in its `if`, so the certificate's presence is
      # settled here, as a flag: with it the DMG is signed and notarized, without
      # it the build stays ad-hoc signed, as it was before the secrets were added.
      SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Saved from main only: a cache saved under a tag is read by nothing else.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../cargo-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ~250 MB from Hugging Face, kept between runs: the key changes only
      # when the script's pinned files do.
      - name: Meeting models cache
        uses: actions/cache@v4
        with:
          path: src-tauri/models/meeting
          key: meeting-models-${{ hashFiles('scripts/fetch-meeting-models.ts') }}

      - name: Fetch meeting models
        run: bun scripts/fetch-meeting-models.ts

      # The Developer ID certificate never lives in the repository: it arrives as
      # `APPLE_CERTIFICATE`, the base64 of a .p12 exported with its private key,
      # and only a keychain of its own, unlocked and its key allowed to codesign,
      # lets the build sign without a session to ask in. Signing and notarization
      # are what stop macOS asking again for the microphone after every update
      # (docs/36) and what makes the DMG open on a machine that did not build it.
      - name: Apple signing certificate
        if: env.SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          # The runner's keychains carry no Developer ID intermediate, and without
          # it codesign cannot build the chain to Apple's root: the build fails
          # with "unable to build chain to self-signed root" and
          # errSecInternalComponent, as a local Mac without it does.
          curl -fsS https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k build.keychain
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

          identity=$(security find-identity -v -p codesigning build.keychain |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in the imported certificate."
            exit 1
          fi

          # Through the environment, not a step's `env:`: an empty secret would
          # arrive as an empty variable, and Tauri reads an empty
          # APPLE_SIGNING_IDENTITY as an identity to sign with rather than as
          # none. Tauri staples the app once Apple has notarized it.
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
              # An App Store Connect key has no password to go stale and none to
              # mistype: it is revoked on the page that issued it, and notarytool
              # takes it as a file. Apple's own name for the Key ID is
              # APPLE_API_KEY, so the key's own text travels as APPLE_API_KEY_P8.
              mkdir -p "$HOME/private_keys"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8"
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            else
              # An unnotarized DMG opens on no machine but the one that built it,
              # so a missing credential is a failure rather than a quiet fallback.
              echo "Signed, but nothing to notarize with: set APPLE_API_KEY," \
                "APPLE_API_ISSUER and APPLE_API_KEY_P8, or APPLE_ID, APPLE_PASSWORD" \
                "and APPLE_TEAM_ID."
              exit 1
            fi
          } >> "$GITHUB_ENV"

      # Main's build is the next patch with the run number after it: newer than
      # the last release, and numeric after the dash because MSI takes no other.
      - name: Build Tauri app
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v=$(bun -p "require('./src-tauri/tauri.conf.json').version")
            v="${v%.*}.$(( ${v##*.} + 1 ))-$GITHUB_RUN_NUMBER"
            bun run tauri build --config "{\"version\":\"$v\"}"
          else
            bun run tauri build
          fi
        env:
          CI: true

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: cargo-build/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Описание релиза - тело сообщения аннотированного тега, и берётся оно
      # через API, а не из клона: actions/checkout заводит у себя легковесный
      # тег, а на нём `git tag --format=%(contents:body)` молча отдаёт тело
      # сообщения коммита вместо тега (так в релиз 0.6.1 уехал один trailer
      # Co-Authored-By). Первые две строки - заголовок тега и пустая строка за
      # ним - отбрасываются: заголовок уже стоит в названии релиза.
      # За ним - раздел CHANGELOG.md этой версии (`## <тег> — <дата>`) с того же
      # коммита, если в сообщении тега его ещё нет.
      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' \
            | tail -n +3 > "$RUNNER_TEMP/notes.md"
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" \
            -H "Accept: application/vnd.github.raw" \
            | awk -v tag="## $GITHUB_REF_NAME " 'index($0, tag) == 1 {f = 1; next} /^## / {f = 0} f && NF' \
            > "$RUNNER_TEMP/changes.md"
          if [ -s "$RUNNER_TEMP/changes.md" ] && ! grep -q '^## Changelog' "$RUNNER_TEMP/notes.md"; then
            printf '\n## Changelog\n\n' >> "$RUNNER_TEMP/notes.md"
            cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          # v0.8.0-rc.1, v0.5.0-alfa: a pre-release, not the Latest one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg

      # One pre-release, replaced by every push to main: deleted with its tag
      # and created again on this commit.
      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          files=(dist/**/*.msi dist/**/*.exe dist/**/*.dmg)
          v=$(basename "${files[-1]}" | sed -E 's/^.*_([^_]+)_[^_]+\.dmg$/\1/')
          gh release delete nightly --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create nightly "${files[@]}" --prerelease --target "$GITHUB_SHA" \
            -R "$GITHUB_REPOSITORY" \
            --title "Nightly $v · $(date -u +%F) (${GITHUB_SHA::7})" \
            --notes "Build of main at $GITHUB_SHA, not a release."
